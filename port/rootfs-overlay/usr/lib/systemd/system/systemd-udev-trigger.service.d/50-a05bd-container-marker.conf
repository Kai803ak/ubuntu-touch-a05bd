[Service]
# This is UT's fake coldplug marker, not the real trigger. Android ueventd
# emits the events. Skip the early marker until the custom container runs;
# lxc@android retries it asynchronously, avoiding a sysinit ordering cycle.
ExecCondition=/bin/sh -ec '/usr/bin/lxc-info -n android -sH 2>/dev/null | /usr/bin/grep -qx RUNNING || /usr/bin/systemctl is-active --quiet systemd-udev-trigger-real.service'
ExecStart=
ExecStart=/usr/bin/true
